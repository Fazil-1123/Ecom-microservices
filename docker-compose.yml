version: '3.8'

services:

  db:
    image: postgres:15
    container_name: postgres_container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ecom_user
      POSTGRES_PASSWORD: ecom_pass123
      POSTGRES_DB: ecom_db
    volumes:
      - postgres_data_db:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecom.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:latest
    command: ["redis-server","--appendonly","yes"]
    ports:
      - "6379:6379"          # remove this if you don’t need host access
    volumes:
      - redis_data:/data     # reuse your existing volume

volumes:
  postgres_data_db:
  pgadmin_data:
  redis_data:
    external: true
    name: a833ea9e29957235ebb3a20ce711ba7993143b00e68c50b0431d2507b6bf4b0f
